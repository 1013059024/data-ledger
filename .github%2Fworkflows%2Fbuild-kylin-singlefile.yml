# 麒麟版数据台账系统 — 单文件可执行文件构建（PyInstaller --onefile）
# 目标机：Kylin V10 aarch64（断网环境，所有依赖打包进二进制）
# 产物：一个 data-ledger 二进制文件，拷贝到麒麟机直接运行

name: 麒麟版构建 - 单文件

on:
  push:
    branches: ["kylin-build"]
    paths:
      - "kylin-build/**"
      - "Dockerfile"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU（ARM64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建单文件可执行文件（内置所有依赖）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=local,dest=./output
          # 缓存加速二次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 构建时需联网下载 conda 包 + pip 包 + emoji 字体，
          # 但最终产物是离线可用的单文件
          build-args: |
            # 无参数，Dockerfile 内已硬编码所有版本

      - name: 列出产物
        run: |
          ls -lh output/dist/
          file output/dist/data-ledger

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: data-ledger-kylin-single-file
          path: output/dist/data-ledger
          retention-days: 30
